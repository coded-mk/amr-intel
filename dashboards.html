<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMR INTEL | National Intelligence Framework</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: { primary: '#3b82f6', surface: '#0f172a', border: 'rgba(255,255,255,0.1)' }
                }
            }
        }
    </script>

    <style>
        .custom-glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .light .custom-glass { background: rgba(255, 255, 255, 0.9); border: 1px solid rgba(0,0,0,0.05); }
        .light body { background-color: #f8fafc; color: #0f172a; }
        .dark body { background-color: #020617; color: #f8fafc; }
        
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .scan-anim { width: 100%; height: 3px; background: #3b82f6; position: absolute; top: 0; left: 0; animation: scanMove 2s infinite linear; box-shadow: 0 0 15px #3b82f6; }
        @keyframes scanMove { 0% {top: 0%} 100% {top: 100%} }
        
        .chat-container { height: 450px; scrollbar-width: thin; scrollbar-color: #334155 transparent; }
        .modal-active { display: flex !important; animation: fadeIn 0.3s ease-out; }
    </style>
</head>
<body class="font-sans antialiased min-h-screen">

    <div class="fixed top-0 left-0 right-0 h-14 flex items-center justify-between px-8 z-[100] border-b dark:border-slate-800 bg-white/50 dark:bg-slate-900/50 backdrop-blur-xl">
        <div class="flex items-center gap-6">
            <span id="live-clock" class="text-sm font-black text-primary">00:00:00</span>
            <span id="live-date" class="text-[10px] font-bold uppercase text-slate-500 tracking-tighter">-- --- ----</span>
        </div>
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2 px-3 py-1 bg-green-500/10 border border-green-500/20 rounded-full">
                <div class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></div>
                <span class="text-[9px] font-black text-green-500 uppercase">National Node: Online</span>
            </div>
            <button onclick="toggleTheme()" class="w-9 h-9 rounded-xl flex items-center justify-center bg-slate-100 dark:bg-slate-800 transition">
                <i id="theme-icon" class="fas fa-moon"></i>
            </button>
        </div>
    </div>

    <div id="global-modal" class="fixed inset-0 z-[200] hidden items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
        <div class="bg-white dark:bg-slate-900 w-full max-w-2xl rounded-[2.5rem] shadow-2xl border dark:border-slate-800 overflow-hidden fade-in">
            <div id="modal-content" class="p-10"></div>
            <div class="bg-slate-50 dark:bg-slate-800/50 p-6 flex justify-end">
                <button onclick="closeModal()" class="px-8 py-3 bg-primary text-white font-bold rounded-2xl shadow-lg shadow-primary/30 active:scale-95 transition text-xs uppercase tracking-widest">Close Panel</button>
            </div>
        </div>
    </div>

    <section id="login-view" class="min-h-screen flex items-center justify-center p-6 bg-slate-50 dark:bg-[#020617] fade-in">
        <div class="w-full max-w-md p-10 rounded-[2.5rem] bg-white dark:bg-slate-900 shadow-2xl border dark:border-slate-800">
            <div class="text-center mb-10">
                <div class="w-16 h-16 bg-primary rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-xl shadow-primary/30">
                    <i class="fas fa-microscope text-2xl text-white"></i>
                </div>
                <h1 class="text-3xl font-extrabold tracking-tight">AMR<span class="text-primary">INTEL</span></h1>
                <p class="text-slate-500 dark:text-slate-400 mt-2 text-sm">Evidence-Based Clinical Infrastructure</p>
            </div>
            <div class="space-y-4">
                <input type="text" id="login-name" placeholder="Full Name" class="w-full h-14 bg-slate-50 dark:bg-slate-800 rounded-2xl px-5 border dark:border-slate-700 outline-none focus:ring-2 focus:ring-primary transition text-sm">
                <select id="login-role" class="w-full h-14 bg-slate-50 dark:bg-slate-800 rounded-2xl px-5 border dark:border-slate-700 outline-none focus:ring-2 focus:ring-primary transition text-sm cursor-pointer">
                    <option value="clinician">Clinician Portal</option>
                    <option value="microbiologist">Laboratory Specialist</option>
                    <option value="patient">Patient Health Card</option>
                </select>
                <input type="text" id="login-user" placeholder="Username" class="w-full h-14 bg-slate-50 dark:bg-slate-800 rounded-2xl px-5 border dark:border-slate-700 outline-none focus:ring-2 focus:ring-primary transition text-sm">
                <input type="password" id="login-pass" placeholder="Password" class="w-full h-14 bg-slate-50 dark:bg-slate-800 rounded-2xl px-5 border dark:border-slate-700 outline-none focus:ring-2 focus:ring-primary transition text-sm">
                <button onclick="handleLogin()" class="w-full h-14 bg-primary hover:bg-blue-600 text-white font-bold rounded-2xl shadow-xl shadow-primary/30 transition-all active:scale-95">
                    Launch Portal
                </button>
            </div>
        </div>
    </section>

    <section id="app-view" class="hidden min-h-screen pt-14 flex">
        <aside class="w-72 border-r dark:border-slate-800 bg-white dark:bg-slate-900 flex flex-col p-6 sticky top-14 h-[calc(100vh-56px)] z-40">
            <div class="mb-10 flex items-center gap-3">
                <div class="w-10 h-10 bg-primary rounded-xl flex items-center justify-center text-white shadow-lg shadow-primary/20">
                    <i class="fas fa-shield-virus"></i>
                </div>
                <div>
                    <h2 class="font-extrabold text-xl tracking-tighter">AMR<span class="text-primary">INTEL</span></h2>
                    <span id="role-tag" class="text-[9px] font-black bg-primary/10 text-primary px-2 py-0.5 rounded uppercase tracking-widest">ROLE</span>
                </div>
            </div>

            <nav id="sidebar-nav" class="flex-1 space-y-1"></nav>

            <div class="mt-auto border-t dark:border-slate-800 pt-6">
                <div class="flex items-center gap-3 mb-6 p-2 rounded-2xl bg-slate-100 dark:bg-slate-800/50">
                    <img id="user-pfp" class="w-10 h-10 rounded-xl">
                    <div class="overflow-hidden">
                        <p id="user-display-name" class="font-bold text-xs truncate">--</p>
                        <p class="text-[9px] text-slate-500 font-bold uppercase">ID: 2026-UDUS</p>
                    </div>
                </div>
                <button onclick="location.reload()" class="w-full flex items-center gap-3 text-red-500 font-bold text-xs px-4 py-3 hover:bg-red-50 dark:hover:bg-red-900/10 rounded-xl transition">
                    <i class="fas fa-power-off"></i> Logout System
                </button>
            </div>
        </aside>

        <main id="main-stage" class="flex-1 p-8 overflow-y-auto">
        </main>
    </section>

    <script>
        /* --- STATE ENGINE --- */
        let state = { name: '', role: '', theme: 'dark', facility: 'Harmony Medical' };
        const demo = { u: 'amrintel', p: 'amrintel123' };

        setInterval(() => {
            const now = new Date();
            document.getElementById('live-clock').innerText = now.toLocaleTimeString();
            document.getElementById('live-date').innerText = now.toLocaleDateString(undefined, { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
        }, 1000);

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            const icon = document.getElementById('theme-icon');
            icon.className = document.documentElement.classList.contains('dark') ? 'fas fa-sun' : 'fas fa-moon';
        }

        function showModal(content) {
            const modal = document.getElementById('global-modal');
            document.getElementById('modal-content').innerHTML = content;
            modal.classList.add('modal-active');
        }

        function closeModal() {
            document.getElementById('global-modal').classList.remove('modal-active');
        }

        /* --- AUTH --- */
        function handleLogin() {
            const u = document.getElementById('login-user').value;
            const p = document.getElementById('login-pass').value;
            state.name = document.getElementById('login-name').value || 'Authorized Member';
            state.role = document.getElementById('login-role').value;

            if(u === demo.u && p === demo.p) {
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('app-view').classList.remove('hidden');
                document.getElementById('app-view').classList.add('flex');
                document.getElementById('role-tag').innerText = state.role;
                document.getElementById('user-display-name').innerText = state.name;
                document.getElementById('user-pfp').src = `https://ui-avatars.com/api/?name=${state.name}&background=3b82f6&color=fff`;
                initRouter();
            } else { alert("Demo Credentials: amrintel / amrintel123"); }
        }

        function initRouter() {
            const nav = document.getElementById('sidebar-nav');
            if(state.role === 'clinician') renderClinicianNav(nav);
            else if(state.role === 'microbiologist') renderMicroNav(nav);
            else renderPatientNav(nav);
        }

        /* =========================================
           CLINICIAN DASHBOARD
        ========================================= */
        function renderClinicianNav(nav) {
            nav.innerHTML = `
                <button onclick="renderSurv()" class="nav-btn active"><i class="fas fa-chart-area mr-3"></i>Surveillance</button>
                <button onclick="renderAI()" class="nav-btn"><i class="fas fa-robot mr-3"></i>ResistanceIQ™</button>
            `;
            renderSurv();
        }

        function renderSurv() {
            document.getElementById('main-stage').innerHTML = `
                <div class="fade-in">
                    <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-10">
                        <div>
                            <h1 class="text-3xl font-extrabold tracking-tight">Facility Intelligence Node</h1>
                            <p class="text-slate-500 font-medium">Real-time surveillance across 36 Nigerian States & 150 Sentinel Centres</p>
                        </div>
                        <div class="flex gap-2 p-1.5 bg-slate-200 dark:bg-slate-800 rounded-2xl border dark:border-slate-700">
                            <select id="facility-filter" onchange="updateCharts()" class="bg-white dark:bg-slate-900 px-4 py-2 rounded-xl text-xs font-bold outline-none border dark:border-slate-700 cursor-pointer">
                                <optgroup label="State Alpha">
                                    <option value="Harmony Medical">Harmony Medical Centre</option>
                                    <option value="Unity Hospital">Unity Hospital</option>
                                    <option value="Sunrise Clinic">Sunrise Clinic</option>
                                </optgroup>
                                <optgroup label="State Beta">
                                    <option value="Beacon Health">Beacon Health Centre</option>
                                    <option value="Evergreen Hospital">Evergreen Hospital</option>
                                    <option value="Riverside Lab">Riverside Lab</option>
                                </optgroup>
                            </select>
                            <button class="bg-primary text-white px-4 py-2 rounded-xl text-[10px] font-black uppercase">Refresh Feed</button>
                        </div>
                    </header>

                    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10">
                        <div class="p-6 bg-white dark:bg-slate-900 rounded-[2rem] border dark:border-slate-800 border-l-4 border-l-primary">
                            <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Facility Tests</p>
                            <h2 class="text-3xl font-extrabold mt-1" id="stat-tests">1,200</h2>
                        </div>
                        <div class="p-6 bg-white dark:bg-slate-900 rounded-[2rem] border dark:border-slate-800 border-l-4 border-l-red-500">
                            <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Resistance Index</p>
                            <h2 class="text-3xl font-extrabold mt-1 text-red-500" id="stat-res">42%</h2>
                        </div>
                        <div class="p-6 bg-white dark:bg-slate-900 rounded-[2rem] border dark:border-slate-800 border-l-4 border-l-green-500">
                            <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Empiric Success</p>
                            <h2 class="text-3xl font-extrabold mt-1 text-green-500">89.4%</h2>
                        </div>
                        <div class="p-6 bg-white dark:bg-slate-900 rounded-[2rem] border dark:border-slate-800 border-l-4 border-l-purple-500">
                            <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest">EMR Bridge</p>
                            <h2 class="text-3xl font-extrabold mt-1 text-purple-400">Stable</h2>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
                        <div class="p-8 bg-white dark:bg-slate-900 rounded-[2.5rem] border dark:border-slate-800 shadow-sm relative">
                            <h3 class="font-black text-xs uppercase text-slate-500 mb-6 tracking-widest">Antibiogram Mapping</h3>
                            <canvas id="complexBarChart" height="220"></canvas>
                        </div>
                        <div class="p-8 bg-white dark:bg-slate-900 rounded-[2.5rem] border dark:border-slate-800 shadow-sm relative">
                            <h3 class="font-black text-xs uppercase text-slate-500 mb-6 tracking-widest">Sentinel Trend Correlation</h3>
                            <canvas id="complexLineChart" height="220"></canvas>
                        </div>
                    </div>

                    <div class="p-8 bg-red-500/5 border border-red-500/20 rounded-[2.5rem] flex items-center justify-between">
                        <div class="flex items-center gap-6">
                            <div class="w-14 h-14 bg-red-500 rounded-2xl flex items-center justify-center text-white text-2xl shadow-lg shadow-red-500/30">
                                <i class="fas fa-exclamation-triangle"></i>
                            </div>
                            <div>
                                <h4 class="font-extrabold text-lg text-red-500">Facility Critical Alert</h4>
                                <p class="text-sm opacity-80" id="alert-text">Harmony Medical Centre reporting 82% Ampicillin resistance in geriatric urine samples.</p>
                            </div>
                        </div>
                        <button onclick="openProtocol()" class="bg-red-500 text-white px-6 py-3 rounded-2xl font-black text-[11px] uppercase tracking-widest shadow-lg hover:scale-105 transition">Review Protocol</button>
                    </div>
                </div>`;
            setTimeout(initComplexCharts, 100);
        }

        function openProtocol() {
            const fac = document.getElementById('facility-filter').value;
            let protocolContent = '';
            
            // Logic for different protocols based on selected facility/state
            if (['Harmony Medical', 'Unity Hospital', 'Sunrise Clinic'].includes(fac)) {
                protocolContent = `
                    <div class="space-y-6">
                        <div class="border-b dark:border-slate-700 pb-4">
                            <h3 class="text-2xl font-black text-red-500 mb-1">State Alpha Protocol</h3>
                            <p class="text-sm text-slate-500 uppercase font-bold tracking-widest">Facility: ${fac}</p>
                        </div>
                        <div class="space-y-4">
                            <div class="p-4 bg-red-500/10 border border-red-500/20 rounded-2xl">
                                <p class="font-bold text-red-500 text-xs uppercase mb-1">Critical Restriction</p>
                                <p class="text-sm text-slate-300"><b>Avoid Ampicillin & Ciprofloxacin</b> immediately for empirical use. Local resistance exceeds 75%.</p>
                            </div>
                            <div class="p-4 bg-blue-500/10 border border-blue-500/20 rounded-2xl">
                                <p class="font-bold text-blue-500 text-xs uppercase mb-1">Recommended Therapy</p>
                                <p class="text-sm text-slate-300">For uncomplicated UTIs, <b>Nitrofurantoin</b> is the first-line agent (12% resistance rate).</p>
                            </div>
                            <div class="p-4 bg-slate-800 rounded-2xl border dark:border-slate-700">
                                <p class="font-bold text-slate-400 text-xs uppercase mb-1">Surveillance Action</p>
                                <p class="text-sm text-slate-300">Enhance infection prevention controls. Screen all geriatric admissions for MRSA.</p>
                            </div>
                        </div>
                    </div>`;
            } else {
                protocolContent = `
                    <div class="space-y-6">
                        <div class="border-b dark:border-slate-700 pb-4">
                            <h3 class="text-2xl font-black text-green-500 mb-1">State Beta Protocol</h3>
                            <p class="text-sm text-slate-500 uppercase font-bold tracking-widest">Facility: ${fac}</p>
                        </div>
                        <div class="space-y-4">
                            <div class="p-4 bg-red-500/10 border border-red-500/20 rounded-2xl">
                                <p class="font-bold text-red-500 text-xs uppercase mb-1">Restriction</p>
                                <p class="text-sm text-slate-300">Avoid <b>Cephalosporins & Fluoroquinolones</b> due to rising ESBL rates.</p>
                            </div>
                            <div class="p-4 bg-purple-500/10 border border-purple-500/20 rounded-2xl">
                                <p class="font-bold text-purple-500 text-xs uppercase mb-1">Stewardship Focus</p>
                                <p class="text-sm text-slate-300">Carbapenems are restricted. Use only for culture-proven multi-drug resistant infections.</p>
                            </div>
                            <div class="p-4 bg-slate-800 rounded-2xl border dark:border-slate-700">
                                <p class="font-bold text-slate-400 text-xs uppercase mb-1">Demographic Action</p>
                                <p class="text-sm text-slate-300">Reinforce wound care education for patients under 25 to prevent skin infection outbreaks.</p>
                            </div>
                        </div>
                    </div>`;
            }
            
            showModal(protocolContent);
        }

        /* =========================================
           MICROBIOLOGIST LOGIC
        ========================================= */
        function renderMicroNav(nav) {
            nav.innerHTML = `
                <button onclick="renderLabForm()" class="nav-btn active"><i class="fas fa-flask mr-3"></i>AST Entry</button>
                <button onclick="renderBatchLogs()" class="nav-btn"><i class="fas fa-database mr-3"></i>Batch Logs</button>
            `;
            renderLabForm();
        }

        function renderLabForm() {
            document.getElementById('main-stage').innerHTML = `
                <div class="fade-in max-w-5xl">
                    <header class="mb-10">
                        <h1 class="text-3xl font-extrabold mb-1">Welcome, ${state.name.split(' ')[0]}!</h1>
                        <p class="text-slate-500 font-medium">Microbiology Department • Institutional ID: 2026-UDUS</p>
                    </header>
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        <div class="space-y-6">
                            <div class="p-8 bg-white dark:bg-slate-900 rounded-[2.5rem] border dark:border-slate-800 shadow-sm relative overflow-hidden">
                                <div class="absolute top-0 right-0 p-3 bg-green-500 text-white font-black text-[9px] uppercase tracking-tighter">Ready</div>
                                <label class="text-[10px] font-black text-primary uppercase mb-4 block tracking-widest">Specimen Acquisition</label>
                                <div class="flex gap-2 mb-6">
                                    <input type="text" id="bc-field" placeholder="Patient/Specimen Barcode..." class="flex-1 h-14 bg-slate-50 dark:bg-slate-800 rounded-2xl px-5 border dark:border-slate-700 outline-none text-sm font-semibold">
                                    <button onclick="runScanner('barcode')" class="w-14 h-14 bg-slate-200 dark:bg-slate-800 rounded-2xl flex items-center justify-center hover:bg-primary hover:text-white transition"><i class="fas fa-qrcode"></i></button>
                                </div>
                                <div class="flex gap-2">
                                    <input type="text" id="voice-field" placeholder="Voice-to-Text Pathogen ID..." class="flex-1 h-14 bg-slate-50 dark:bg-slate-800 rounded-2xl px-5 border dark:border-slate-700 outline-none text-sm font-semibold">
                                    <button onclick="runVoiceSim()" class="w-14 h-14 bg-primary text-white rounded-2xl shadow-xl shadow-primary/30 flex items-center justify-center"><i class="fas fa-microphone"></i></button>
                                </div>
                            </div>
                            <button onclick="alert('Record Synced to National Grid!')" class="w-full py-5 bg-primary text-white font-black text-sm rounded-[2rem] shadow-xl shadow-primary/20 hover:scale-[1.01] transition uppercase tracking-widest">Commit Data Entry</button>
                        </div>
                        <div class="bg-slate-950 rounded-[2.5rem] border-4 border-slate-800 relative overflow-hidden h-[400px] flex flex-col items-center justify-center shadow-2xl group">
                            <video id="webcam" class="hidden w-full h-full object-cover"></video>
                            <div id="cam-overlay" class="text-center p-8">
                                <i class="fas fa-camera-viewfinder text-5xl text-slate-800 mb-6 transition group-hover:text-primary"></i>
                                <h4 class="font-extrabold text-slate-400 text-lg">AI SMART SCANNER</h4>
                                <p class="text-xs text-slate-600 mt-2 max-w-[200px]">Barcode identification & Zone inhibition auto-measurement</p>
                                <button onclick="runCamera()" class="mt-8 px-10 py-4 bg-primary text-white rounded-full font-black text-xs shadow-xl shadow-primary/40 hover:scale-105 transition">ACTIVATE SCANNER</button>
                            </div>
                            <div id="scan-bar" class="hidden scan-anim"></div>
                        </div>
                    </div>
                </div>`;
        }

        function renderBatchLogs() {
            const logs = [
                {id: 'UD-9021', state: 'Alpha', drug: 'Ampicillin', status: 'Synced', color: 'green'},
                {id: 'UD-9022', state: 'Alpha', drug: 'Ciprofloxacin', status: 'Synced', color: 'green'},
                {id: 'UD-9023', state: 'Beta', drug: 'Meropenem', status: 'Synced', color: 'green'},
                {id: 'UD-9024', state: 'Beta', drug: 'Gentamicin', status: 'Synced', color: 'green'},
                {id: 'UD-9025', state: 'Alpha', drug: 'Amoxicillin', status: 'Offline Buffer', color: 'amber'},
                {id: 'UD-9026', state: 'Beta', drug: 'Nitrofurantoin', status: 'Synced', color: 'green'},
                {id: 'UD-9027', state: 'Alpha', drug: 'Penicillin', status: 'Offline Buffer', color: 'amber'},
                {id: 'UD-9028', state: 'Beta', drug: 'Ceftriaxone', status: 'Synced', color: 'green'},
                {id: 'UD-9029', state: 'Alpha', drug: 'Vancomycin', status: 'Synced', color: 'green'},
                {id: 'UD-9030', state: 'Beta', drug: 'Doxycycline', status: 'Synced', color: 'green'},
                {id: 'UD-9031', state: 'Alpha', drug: 'Erythromycin', status: 'Offline Buffer', color: 'amber'},
                {id: 'UD-9032', state: 'Beta', drug: 'Tetracycline', status: 'Synced', color: 'green'}
            ];

            document.getElementById('main-stage').innerHTML = `
                <div class="fade-in max-w-5xl">
                    <h2 class="text-3xl font-extrabold mb-8 tracking-tight">Sentinel Batch History</h2>
                    <div class="grid gap-3">
                        ${logs.map(log => `
                            <div onclick="openLogDetails('${log.id}', '${log.state}', '${log.drug}', '${log.status}')" class="p-6 bg-white dark:bg-slate-900 rounded-3xl border dark:border-slate-800 flex justify-between items-center hover:bg-slate-50 dark:hover:bg-slate-800/80 transition cursor-pointer group">
                                <div class="flex items-center gap-5">
                                    <div class="w-12 h-12 bg-slate-100 dark:bg-slate-800 rounded-2xl flex items-center justify-center text-primary border dark:border-slate-700 group-hover:bg-primary group-hover:text-white transition">
                                        <i class="fas fa-microscope text-lg"></i>
                                    </div>
                                    <div>
                                        <p class="font-black text-sm">Sequence Record ${log.id}</p>
                                        <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">Region: State ${log.state} | Isolate: ${log.drug}</p>
                                    </div>
                                </div>

        function runAIQuest(i) {
            const win = document.getElementById('ai-chat-window');
            const q = [

                "Which pathogen is most prevalent among seniors?",
                "Are urine samples showing increasing resistance over the past quarter?",
                "What are the recommendations for State Alpha?",
                "Explain the tailoring of prevention efforts for State Beta."
            ];
            const a = [
                `Based on 2,150 facility records: Avoid <b>Ampicillin</b> (>80% resistance). <b>Nitrofurantoin</b> is 92% effective for UTIs.`,
                `<b>Demographic Analysis:</b> <i>E. coli</i> is prevalent in 64% of seniors in State Beta. Resistance is climbing in this sector.`,
                `Yes. Riverside Lab data shows a <b>22% spike</b> in resistance to Fluoroquinolones in urine isolates since October.`,
                `1. Stop empirical Ampicillin immediately. 2. Implement IPC protocols in Harmony Medical. 3. Monitor geriatric trends.`,
                `Beta strategy focuses on <b>stewardship education</b> and wound care for younger age groups to prevent skin/soft tissue resistance.`
            ];

            win.innerHTML += `<div class="bg-primary text-white p-5 rounded-3xl rounded-tr-none max-w-[80%] ml-auto text-sm font-bold shadow-lg shadow-primary/20">${q[i]}</div>`;
            setTimeout(() => {
                win.innerHTML += `

                    </div>`;
                win.scrollTop = win.scrollHeight;
            }, 600);
        }

            const q = document.getElementById('manual-ai-query').value;

        /* =========================================
           HARDWARE & AI ENGINE
        ========================================= */
        async function runCamera() {
            const v = document.getElementById('webcam');
            const o = document.getElementById('cam-overlay');
            const s = document.getElementById('scan-bar');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                v.srcObject = stream;
                v.classList.remove('hidden');
                o.classList.add('hidden');
                s.classList.remove('hidden');
                v.play();
                setTimeout(() => {
                    stream.getTracks().forEach(t => t.stop());
                    v.classList.add('hidden');
                    s.classList.add('hidden');
                    o.classList.remove('hidden');
                    document.getElementById('bc-field').value = "SPEC-2026-X911";
                    alert("AI Node Capture: Isolate identified. Zone inhibition detected at 21mm.");
                }, 4000);
            } catch(e) { alert("Camera Access Required for Hardware Simulation."); }
        }

        function runScanner(type) { runCamera(); }

        function generateHighEndPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            // Header
            doc.setFillColor(59, 130, 246); // Blue
            doc.rect(0, 0, 210, 30, 'F');
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(18);
            doc.text("AMR INTEL HEALTH RECORD", 14, 20);
            
            // Patient Info
            doc.setTextColor(50, 50, 50);
            doc.setFontSize(12);
            doc.text(`Patient Name: ${state.name}`, 14, 45);
            doc.text(`Date: ${new Date().toLocaleDateString()}`, 140, 45);
            doc.text(`Ref ID: #UDUS-902`, 14, 55);
            doc.text(`Facility: Harmony Medical Centre`, 14, 65);

            // Table
            doc.autoTable({
                startY: 75,
                head: [['Parameter', 'Result', 'Clinical Note']],
                body: [
                    ['Pathogen', 'Klebsiella pneumoniae', 'Confirmed Isolate'],
                    ['Resistance', 'Sensitive', 'Respond to Meropenem'],
                    ['Status', 'Active Infection', 'Treatment Required']
                ],
                headStyles: { fillColor: [59, 130, 246] },
                alternateRowStyles: { fillColor: [240, 245, 255] }
            });

            // Warnings
            const finalY = doc.lastAutoTable.finalY + 15;
            doc.setTextColor(220, 38, 38); // Red
            doc.setFontSize(14);
            doc.text("CRITICAL WARNINGS:", 14, finalY);
            
            doc.setTextColor(80, 80, 80);
            doc.setFontSize(10);
            doc.text("1. Always complete the full course of your prescribed antibiotic.", 14, finalY + 10);
            doc.text("2. Never share your medication with others. Each infection is unique.", 14, finalY + 16);
            doc.text("3. If symptoms persist, return to the clinic immediately.", 14, finalY + 22);

            doc.save(`AMR_Report_${state.name.replace(' ', '_')}.pdf`);
        }
