<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMR INTEL | National Intelligence Framework</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: { primary: '#3b82f6', surface: '#0f172a', border: 'rgba(255,255,255,0.1)' }
                }
            }
        }
    </script>

    <style>
        .custom-glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .light .custom-glass { background: rgba(255, 255, 255, 0.9); border: 1px solid rgba(0,0,0,0.05); }
        /* Improved Light Theme Colors */
        .light body { background-color: #f1f5f9; color: #0f172a; } 
        .dark body { background-color: #020617; color: #f8fafc; }
        
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .scan-anim { width: 100%; height: 3px; background: #3b82f6; position: absolute; top: 0; left: 0; animation: scanMove 2s infinite linear; box-shadow: 0 0 15px #3b82f6; }
        @keyframes scanMove { 0% {top: 0%} 100% {top: 100%} }
        
        .chat-container { height: 450px; scrollbar-width: thin; scrollbar-color: #334155 transparent; }
        .modal-active { display: flex !important; animation: fadeIn 0.3s ease-out; }
        
        /* Radio Card Styling */
        .radio-card:checked + div { border-color: #3b82f6; background-color: rgba(59, 130, 246, 0.1); }
        .radio-card:checked + div i, .radio-card:checked + div span { color: #3b82f6; }
        
        /* Nav Button Styling */
        .nav-btn { width: 100%; text-align: left; padding: 1.1rem; border-radius: 1.2rem; font-weight: 700; color: #64748b; transition: all 0.2s; font-size: 0.85rem; }
        .nav-btn:hover { background-color: rgba(59, 130, 246, 0.05); color: #3b82f6; }
        .nav-btn.active { background: rgba(59, 130, 246, 0.1); color: #3b82f6; border: 1px solid rgba(59, 130, 246, 0.2); }
    </style>
</head>
<body class="font-sans antialiased min-h-screen">

    <div class="fixed top-0 left-0 right-0 h-14 flex items-center justify-between px-8 z-[100] border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/50 backdrop-blur-xl">
        <div class="flex items-center gap-6">
            <span id="live-clock" class="text-sm font-black text-primary">00:00:00</span>
            <span id="live-date" class="text-[10px] font-bold uppercase text-slate-500 tracking-tighter">-- --- ----</span>
        </div>
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2 px-3 py-1 bg-green-500/10 border border-green-500/20 rounded-full">
                <div class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></div>
                <span class="text-[9px] font-black text-green-600 dark:text-green-500 uppercase">National Node: Online</span>
            </div>
            <button onclick="toggleTheme()" class="w-9 h-9 rounded-xl flex items-center justify-center bg-slate-100 dark:bg-slate-800 transition hover:bg-slate-200 dark:hover:bg-slate-700">
                <i id="theme-icon" class="fas fa-moon text-slate-600 dark:text-slate-400"></i>
            </button>
        </div>
    </div>

    <div id="global-modal" class="fixed inset-0 z-[200] hidden items-center justify-center p-4 bg-slate-900/50 dark:bg-slate-950/80 backdrop-blur-sm">
        <div class="bg-white dark:bg-slate-900 w-full max-w-2xl rounded-[2.5rem] shadow-2xl border border-slate-200 dark:border-slate-800 overflow-hidden fade-in">
            <div id="modal-content" class="p-10 text-slate-800 dark:text-slate-200"></div>
            <div class="bg-slate-50 dark:bg-slate-800/50 p-6 flex justify-end border-t border-slate-100 dark:border-slate-800">
                <button onclick="closeModal()" class="px-8 py-3 bg-primary text-white font-bold rounded-2xl shadow-lg shadow-primary/30 active:scale-95 transition text-xs uppercase tracking-widest">Close Panel</button>
            </div>
        </div>
    </div>

    <section id="login-view" class="min-h-screen flex items-center justify-center p-6 bg-slate-100 dark:bg-[#020617] fade-in">
        <div class="w-full max-w-md p-10 rounded-[2.5rem] bg-white dark:bg-slate-900 shadow-2xl border border-slate-200 dark:border-slate-800">
            <div class="text-center mb-10">
                <div class="w-16 h-16 bg-primary rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-xl shadow-primary/30">
                    <i class="fas fa-microscope text-2xl text-white"></i>
                </div>
                <h1 class="text-3xl font-extrabold tracking-tight text-slate-900 dark:text-white">AMR<span class="text-primary">INTEL</span></h1>
                <p class="text-slate-500 dark:text-slate-400 mt-2 text-sm">Evidence-Based Clinical Infrastructure</p>
            </div>
            
            <div class="space-y-5">
                <input type="text" id="login-name" placeholder="Full Name" class="w-full h-14 bg-slate-50 dark:bg-slate-800 rounded-2xl px-5 border border-slate-200 dark:border-slate-700 outline-none focus:ring-2 focus:ring-primary transition text-sm text-slate-900 dark:text-white">
                
                <div>
                    <p class="text-[10px] font-bold text-slate-500 uppercase mb-2 ml-1">Select Access Portal</p>
                    <div class="grid grid-cols-3 gap-2">
                        <label class="cursor-pointer">
                            <input type="radio" name="login-role" value="clinician" class="radio-card sr-only" checked>
                            <div class="flex flex-col items-center justify-center h-20 bg-slate-50 dark:bg-slate-800 rounded-2xl border-2 border-transparent transition hover:bg-slate-100 dark:hover:bg-slate-700 border-slate-200 dark:border-slate-700">
                                <i class="fas fa-user-md text-xl mb-1 text-slate-400"></i>
                                <span class="text-[9px] font-black uppercase text-slate-500">Clinician</span>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="login-role" value="microbiologist" class="radio-card sr-only">
                            <div class="flex flex-col items-center justify-center h-20 bg-slate-50 dark:bg-slate-800 rounded-2xl border-2 border-transparent transition hover:bg-slate-100 dark:hover:bg-slate-700 border-slate-200 dark:border-slate-700">
                                <i class="fas fa-flask text-xl mb-1 text-slate-400"></i>
                                <span class="text-[9px] font-black uppercase text-slate-500">Lab</span>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="login-role" value="patient" class="radio-card sr-only">
                            <div class="flex flex-col items-center justify-center h-20 bg-slate-50 dark:bg-slate-800 rounded-2xl border-2 border-transparent transition hover:bg-slate-100 dark:hover:bg-slate-700 border-slate-200 dark:border-slate-700">
                                <i class="fas fa-user-injured text-xl mb-1 text-slate-400"></i>
                                <span class="text-[9px] font-black uppercase text-slate-500">Patient</span>
                            </div>
                        </label>
                    </div>
                </div>

                <div class="space-y-3 pt-2">
                    <input type="text" id="login-user" placeholder="Username" class="w-full h-14 bg-slate-50 dark:bg-slate-800 rounded-2xl px-5 border border-slate-200 dark:border-slate-700 outline-none focus:ring-2 focus:ring-primary transition text-sm text-slate-900 dark:text-white">
                    <input type="password" id="login-pass" placeholder="Password" class="w-full h-14 bg-slate-50 dark:bg-slate-800 rounded-2xl px-5 border border-slate-200 dark:border-slate-700 outline-none focus:ring-2 focus:ring-primary transition text-sm text-slate-900 dark:text-white">
                </div>

                <button onclick="handleLogin()" class="w-full h-14 bg-primary hover:bg-blue-600 text-white font-bold rounded-2xl shadow-xl shadow-primary/30 transition-all active:scale-95 mt-2">
                    Authorize & Launch
                </button>
            </div>
        </div>
    </section>

    <section id="app-view" class="hidden min-h-screen pt-14 flex">
        <aside class="w-72 border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 flex flex-col p-6 sticky top-14 h-[calc(100vh-56px)] z-40 transition-colors duration-300">
            <div class="mb-10 flex items-center gap-3">
                <div class="w-10 h-10 bg-primary rounded-xl flex items-center justify-center text-white shadow-lg shadow-primary/20">
                    <i class="fas fa-microscope"></i> </div>
                <div>
                    <h2 class="font-extrabold text-xl tracking-tighter text-slate-900 dark:text-white">AMR<span class="text-primary">INTEL</span></h2>
                    <span id="role-tag" class="text-[9px] font-black bg-primary/10 text-primary px-2 py-0.5 rounded uppercase tracking-widest">ROLE</span>
                </div>
            </div>

            <nav id="sidebar-nav" class="flex-1 space-y-1"></nav>

            <div class="mt-auto border-t border-slate-200 dark:border-slate-800 pt-6">
                <div class="flex items-center gap-3 mb-6 p-2 rounded-2xl bg-slate-100 dark:bg-slate-800/50">
                    <img id="user-pfp" class="w-10 h-10 rounded-xl">
                    <div class="overflow-hidden">
                        <p id="user-display-name" class="font-bold text-xs truncate text-slate-800 dark:text-white">--</p>
                        <p class="text-[9px] text-slate-500 font-bold uppercase">ID: 2026-UDUS</p>
                    </div>
                </div>
                <button onclick="location.reload()" class="w-full flex items-center gap-3 text-red-500 font-bold text-xs px-4 py-3 hover:bg-red-50 dark:hover:bg-red-900/10 rounded-xl transition">
                    <i class="fas fa-power-off"></i> Logout System
                </button>
            </div>
        </aside>

        <main id="main-stage" class="flex-1 p-8 overflow-y-auto bg-slate-50 dark:bg-[#020617] transition-colors duration-300">
        </main>
    </section>

    <script src="script.js"></script>
</body>
</html>
